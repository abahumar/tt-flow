<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikTok Affiliate Flow</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f9fafb;
        color: #1f2937;
        font-size: 13px;
        width: 100%;
        min-width: 280px;
      }

      .header {
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .header .logo {
        width: 28px;
        height: 28px;
        background: #f43f5e;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: bold;
        font-size: 14px;
      }
      .header h1 {
        font-size: 15px;
        font-weight: 700;
      }

      .tabs {
        display: flex;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
      }
      .tab {
        flex: 1;
        padding: 8px 4px;
        text-align: center;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        color: #6b7280;
        transition: all 0.2s;
      }
      .tab:hover {
        color: #1f2937;
      }
      .tab.active {
        color: #f43f5e;
        border-bottom-color: #f43f5e;
      }

      .content {
        padding: 12px 16px;
      }

      .status-card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 10px;
      }
      .status-card h3 {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .status-card .status {
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 12px;
        display: inline-block;
      }
      .status.pending {
        background: #f3f4f6;
        color: #6b7280;
      }
      .status.active {
        background: #dbeafe;
        color: #2563eb;
      }
      .status.done {
        background: #d1fae5;
        color: #059669;
      }
      .status.error {
        background: #fee2e2;
        color: #dc2626;
      }

      .progress-steps {
        list-style: none;
        margin-top: 10px;
      }
      .progress-steps li {
        padding: 6px 0;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #6b7280;
      }
      .progress-steps li.complete {
        color: #059669;
      }
      .progress-steps li.active {
        color: #2563eb;
        font-weight: 600;
      }
      .progress-steps li .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #d1d5db;
        flex-shrink: 0;
      }
      .progress-steps li.complete .dot {
        background: #059669;
      }
      .progress-steps li.active .dot {
        background: #2563eb;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid #e5e7eb;
        background: #fff;
        color: #374151;
        transition: all 0.15s;
      }
      .btn:hover {
        background: #f9fafb;
      }
      .btn-primary {
        background: #f43f5e;
        color: #fff;
        border-color: #f43f5e;
      }
      .btn-primary:hover {
        background: #e11d48;
      }

      .btn-row {
        display: flex;
        gap: 6px;
        margin-top: 10px;
        flex-wrap: wrap;
      }

      .progress-bar {
        height: 4px;
        background: #e5e7eb;
        border-radius: 2px;
        margin-top: 8px;
        overflow: hidden;
      }
      .progress-bar .fill {
        height: 100%;
        background: #f43f5e;
        border-radius: 2px;
        transition: width 0.3s;
      }

      .empty-state {
        text-align: center;
        padding: 30px 16px;
        color: #9ca3af;
      }
      .empty-state p {
        margin-top: 6px;
        font-size: 12px;
      }

      .badge-row {
        display: flex;
        gap: 4px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .badge {
        font-size: 10px;
        padding: 2px 8px;
        border-radius: 10px;
        font-weight: 500;
      }
      .badge-green {
        background: #d1fae5;
        color: #059669;
      }
      .badge-blue {
        background: #dbeafe;
        color: #2563eb;
      }
      .badge-yellow {
        background: #fef3c7;
        color: #d97706;
      }

      .product-info {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .product-info img {
        width: 40px;
        height: 40px;
        border-radius: 6px;
        object-fit: cover;
        background: #f3f4f6;
      }
      .product-info .details {
        flex: 1;
        min-width: 0;
      }
      .product-info .title {
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .product-info .meta {
        font-size: 11px;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">T</div>
      <h1>TikTok Flow</h1>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="image">Image</div>
      <div class="tab" data-tab="video">Video</div>
      <div class="tab" data-tab="tiktok">TikTok</div>
      <div class="tab" data-tab="history">History</div>
    </div>

    <div id="tab-image" class="content">
      <div id="image-content">
        <div class="empty-state">
          <p>No active job.</p>
          <p>Start automation from the web app.</p>
        </div>
      </div>
    </div>

    <div id="tab-video" class="content" style="display: none">
      <div id="video-content">
        <div class="empty-state">
          <p>No video generation in progress.</p>
        </div>
      </div>
    </div>

    <div id="tab-tiktok" class="content" style="display: none">
      <div id="tiktok-content">
        <div class="empty-state">
          <p>No posting in progress.</p>
        </div>
      </div>
    </div>

    <div id="tab-history" class="content" style="display: none">
      <div id="history-content">
        <div class="empty-state">
          <p>Job history will appear here.</p>
        </div>
      </div>
    </div>

    <!-- Auto mode controls + scrape section -->
    <div style="padding: 8px 16px">
      <div class="scrape-section">
        <div class="btn-row" style="margin-bottom: 8px">
          <button
            class="btn btn-primary"
            id="autoModeBtn"
            style="flex: 1; justify-content: center"
          >
            ▶ Start Auto Mode
          </button>
        </div>
        <button class="btn btn-scrape" id="scrapeBtn">
          📦 Scrape Current Page
        </button>
        <div id="scrapeResult"></div>
      </div>
    </div>

    <script src="sidepanel.js"></script>
  </body>
</html>
