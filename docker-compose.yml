services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - db-data:/data
      - video-data:/data/videos
    environment:
      - DATABASE_URL=file:/data/dev.db
      - NODE_ENV=development
    restart: unless-stopped

volumes:
  db-data:
  video-data:
